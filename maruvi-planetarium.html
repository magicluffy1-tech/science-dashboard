<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>마루비 별자리 해설 천체투영관</title>
<style>
:root{--bg:#04060d;--panel:rgba(10,15,28,.78);--line:rgba(120,160,255,.28);--txt:#dfe8ff;--dim:#8fa3cf;--acc:#ffd36e;--acc2:#6fb1ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0}
canvas#sky{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas#sky.drag{cursor:grabbing}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

#wm{position:absolute;right:10px;bottom:90px;z-index:4;display:inline-flex;align-items:center;gap:6px;padding:3px 13px 3px 4px;background:rgba(255,255,255,.96);border:1px solid #d6dbe4;border-radius:999px;box-shadow:0 1px 5px rgba(0,0,0,.4);font-family:Georgia,'Times New Roman',serif;pointer-events:none;user-select:none;-webkit-user-select:none;line-height:1}
#wm .c{width:20px;height:20px;border-radius:50%;background:#2f8f5b;color:#fff;font:700 12px/20px Arial,sans-serif;text-align:center}
#wm .m{color:#666;font-size:13px}
#wm .n{color:#2b7a52;font-size:14.5px;font-weight:700}
#app.arOn #wm{bottom:104px}
@media (max-width:520px){#wm{transform:scale(.88);transform-origin:bottom right;right:8px;bottom:90px}}
#hudTL{position:absolute;left:10px;top:10px;padding:8px 12px;font-size:13px;line-height:1.5;max-width:46vw;pointer-events:none}
#hudTL b{color:var(--acc);font-weight:600}
#hudTL .small{color:var(--dim);font-size:12px}
#info{position:absolute;right:10px;top:10px;width:300px;max-width:calc(100vw - 20px);padding:12px 14px;display:none;font-size:13px;line-height:1.55;max-height:calc(100% - 160px);overflow:auto}
#info h3{margin:0 0 2px;font-size:17px;color:var(--acc)}
#info .en{color:var(--dim);font-size:12px;margin-bottom:6px}
#info table{width:100%;border-collapse:collapse}
#info td{padding:2px 0;vertical-align:top}
#info td:first-child{color:var(--dim);width:42%;padding-right:6px}
#info .note{color:var(--dim);font-size:11.5px;margin-top:6px}
#info .btns{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
#info .x{position:absolute;right:8px;top:6px;cursor:pointer;color:var(--dim);font-size:18px}
.btn{background:rgba(40,60,110,.55);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{background:rgba(70,100,180,.6)}
.btn.on{background:rgba(255,211,110,.22);border-color:var(--acc);color:var(--acc)}
.btn.sm{padding:4px 8px;font-size:12px}
#toolbar{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;display:flex;gap:4px;padding:6px;max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
#toolbar::-webkit-scrollbar{display:none}
#toolbar .btn{white-space:nowrap;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:52px;padding:5px 7px;font-size:11.5px}
#toolbar .btn i{font-style:normal;font-size:17px;line-height:1.1}
#toolbar .sep{width:1px;background:var(--line);margin:2px 3px;flex:0 0 1px}
#timebar{position:absolute;left:10px;bottom:84px;padding:6px 8px;display:flex;align-items:center;gap:4px;font-size:12.5px;flex-wrap:wrap;max-width:calc(100vw - 20px)}
#timebar .rate{min-width:68px;text-align:center;color:var(--acc)}
#search{position:absolute;left:50%;transform:translateX(-50%);top:10px;width:300px;max-width:calc(100vw - 24px);display:none;z-index:6}
#search input{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(10,15,28,.92);color:var(--txt);font-size:15px;outline:none;font-family:inherit}
#search .res{margin-top:4px;max-height:280px;overflow:auto}
#search .res div{padding:7px 12px;cursor:pointer;font-size:14px;border-bottom:1px solid rgba(120,160,255,.12)}
#search .res div:hover,#search .res div.sel{background:rgba(70,100,180,.5)}
#search .res small{color:var(--dim);margin-left:6px}
#subtitle{position:absolute;left:50%;transform:translateX(-50%);bottom:152px;width:min(880px,calc(100vw - 24px));padding:10px 16px;font-size:clamp(14px,1.7vw,19px);line-height:1.55;text-align:center;display:none;background:rgba(2,5,12,.82);border:1px solid var(--line);border-radius:12px;text-shadow:0 1px 3px #000;pointer-events:none}
#subtitle .ttl{color:var(--acc);font-size:.72em;display:block;margin-bottom:2px;letter-spacing:.02em}
#subtitle .ask{display:block;margin-top:8px;color:#9be7ff;font-size:.88em}
#showbar{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;display:none;align-items:center;gap:6px;padding:6px 10px;max-width:calc(100vw - 16px)}
#showbar .prog{width:min(260px,30vw);height:6px;background:rgba(120,160,255,.2);border-radius:4px;overflow:hidden}
#showbar .prog>div{height:100%;width:0;background:var(--acc)}
#showbar .sn{font-size:12.5px;color:var(--dim);min-width:84px;text-align:center}
#drawer{position:absolute;left:0;top:0;bottom:0;width:320px;max-width:86vw;padding:14px;display:none;overflow:auto;z-index:7;border-radius:0 12px 12px 0}
#drawer h2{margin:0 0 8px;font-size:16px;color:var(--acc)}
#drawer .sc{padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:13.5px}
#drawer .sc:hover{background:rgba(70,100,180,.35)}
#drawer .sc.cur{border-color:var(--acc);background:rgba(255,211,110,.12)}
#drawer .sc small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
.modal{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9}
.modal .box{width:min(560px,calc(100vw - 20px));max-height:calc(100% - 30px);overflow:auto;padding:16px 18px;font-size:14px;background:rgba(10,15,28,.97);border:1px solid var(--line);border-radius:12px}
.modal h2{margin:0 0 10px;font-size:17px;color:var(--acc)}
.modal label{display:block;margin:10px 0 3px;color:var(--dim);font-size:12.5px}
.modal select,.modal input[type=datetime-local],.modal input[type=number]{width:100%;padding:7px 9px;background:#0b1224;color:var(--txt);border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
.modal input[type=range]{width:100%}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#scriptBox{width:min(820px,calc(100vw - 20px))}
#scriptBox .scn{border-top:1px solid var(--line);padding:10px 0}
#scriptBox .scn h3{margin:0 0 4px;font-size:15px;color:var(--acc)}
#scriptBox .scn p{margin:4px 0;line-height:1.65}
#scriptBox .q{color:#9be7ff}
#scriptBox .a{color:#b8ffcf;font-size:13px}
#v3{position:absolute;inset:0;background:rgba(2,4,10,.96);display:none;z-index:8}
#v3 canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#v3 .top{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px}
#v3 .bot{position:absolute;left:10px;right:10px;bottom:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
#v3 .bot input[type=range]{flex:1;min-width:140px}
#v3 select{padding:6px 8px;background:#0b1224;color:var(--txt);border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit}
#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);padding:8px 14px;background:rgba(0,0,0,.8);border:1px solid var(--line);border-radius:10px;font-size:13px;display:none;z-index:20;pointer-events:none}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s;z-index:5}
@media (max-width:640px){#hudTL{font-size:11.5px;max-width:60vw;padding:6px 9px}#info{top:auto;bottom:150px;right:8px;width:calc(100vw - 16px);max-height:40vh}#toolbar .btn{min-width:46px;font-size:10.5px}#timebar{bottom:80px;font-size:11.5px}}
@media print{body *{visibility:hidden}#scriptBox,#scriptBox *{visibility:visible}#scriptBox{position:absolute;left:0;top:0;width:100%;max-height:none;color:#000;background:#fff;border:0}#scriptBox .q{color:#036}#scriptBox .a{color:#063}#scriptBox h2,#scriptBox h3{color:#000}.noprint{display:none!important}}
</style>
</head>
<body>
<div id="app">
<div id="wm" aria-label="Made by Cho"><span class="c">C</span><span class="m">Made by</span><span class="n">Cho</span></div>
  <canvas id="sky"></canvas>
  <div id="fade"></div>
  <div id="hudTL" class="panel"></div>
  <div id="info" class="panel"></div>
  <div id="search"><input id="q" type="text" placeholder="별·별자리·행성 검색 (예: 오리온, 북극성, 목성)" autocomplete="off"><div class="res panel"></div></div>
  <div id="subtitle"></div>
  <div id="showbar" class="panel"></div>
  <div id="timebar" class="panel"></div>
  <div id="toolbar" class="panel"></div>
  <div id="drawer" class="panel"></div>
  <div id="toast"></div>

  <div id="settingsM" class="modal"><div class="box">
    <h2>⚙ 장소 · 시간 · 하늘 설정</h2>
    <label>관측 장소</label>
    <select id="selPlace"></select>
    <div class="row"><button class="btn sm" id="btnHere">📍 내 위치로 설정</button><span id="hereMsg" style="color:var(--dim);font-size:12px;align-self:center"></span></div>
    <div class="row"><div style="flex:1"><label>위도(°, 북+)</label><input type="number" id="inLat" step="0.1" min="-90" max="90"></div><div style="flex:1"><label>경도(°, 동+)</label><input type="number" id="inLon" step="0.1" min="-180" max="180"></div></div>
    <label>날짜·시각 (현지 시각)</label>
    <input type="datetime-local" id="inDate">
    <div class="row">
      <button class="btn sm" data-jump="-1d">−1일</button><button class="btn sm" data-jump="-1h">−1시간</button><button class="btn sm" data-jump="+1h">+1시간</button><button class="btn sm" data-jump="+1d">+1일</button><button class="btn sm" data-jump="+1M">+1개월</button><button class="btn sm" data-jump="now">지금</button>
    </div>
    <div class="row">
      <button class="btn sm" data-tod="sunset">해 진 직후</button><button class="btn sm" data-tod="21">밤 9시</button><button class="btn sm" data-tod="0">자정</button><button class="btn sm" data-tod="sunrise">해 뜨기 전</button><button class="btn sm" data-tod="12">정오</button>
    </div>
    <label>하늘 밝기(광해): <span id="lpv"></span></label>
    <input type="range" id="inLp" min="1" max="9" step="1">
    <div class="small" style="color:var(--dim);font-size:12px">1 = 아주 어두운 시골 · 9 = 도심. 숫자가 커질수록 희미한 별과 은하수가 사라집니다.</div>
    <label>별 크기: <span id="ssv"></span></label>
    <input type="range" id="inSs" min="0.6" max="1.8" step="0.1">
    <div style="margin-top:12px;color:var(--dim);font-size:11.5px;line-height:1.5">별 자료: HYG 데이터베이스 v4.1 (Hipparcos·Yale·Gliese, CC BY-SA 4.0) · 별자리선·은하수·성운 자료: d3-celestial (BSD-3) · 천체 위치 계산: Astronomy Engine (MIT). 별 거리는 히파르코스 위성 측정값이며 먼 별은 오차가 큽니다.</div><div class="foot"><button class="btn" id="btnSetClose">닫기</button></div>
  </div></div>

  <div id="scriptM" class="modal"><div class="box" id="scriptBox"></div></div>

  <div id="v3">
    <canvas id="c3"></canvas>
    <div class="top panel"><b style="color:var(--acc)">🌌 별자리 3D 거리 보기</b>
      <select id="sel3"></select>
      <button class="btn sm" id="b3play">▶ 돌려 보기</button>
      <button class="btn sm" id="b3lab">이름 표시</button>
      <span style="flex:1"></span>
      <button class="btn sm" id="b3close">✕ 닫기</button>
    </div>
    <div class="bot panel">
      <span style="white-space:nowrap">지구에서 본 모습</span>
      <input type="range" id="r3" min="0" max="90" step="1" value="0">
      <span style="white-space:nowrap">옆에서 본 모습</span>
      <span id="t3" style="color:var(--dim);font-size:12px;flex-basis:100%"></span>
    </div>
  </div>
</div>

// ---------------------------------------------------------------- render loop
let needs=true; function dirty(){needs=true}
let lastFrame=performance.now(), lastHud=0;
function render(now){
  resize(); frameSetup(); camSetup(); computeStars();
  ctx.clearRect(0,0,FR.W,FR.H);
  drawSky(); drawGrid(); drawDSO(); drawTrails(); drawConstellations(); drawStars(); drawBodies(); drawGround(); drawStarNames(); drawCardinal(); drawHighlights(now); drawMeasure();
  if(window.__postRender)window.__postRender(now);
}
function tick(now){
  const dt=Math.min(100,now-lastFrame); lastFrame=now;
  let anim=false;
  if(S.playing&&S.rate!==0){S.t+=dt*S.rate;anim=true}
  if(tween.active){tweenStep(now);anim=true}
  if(window.__tick){if(window.__tick(now,dt))anim=true}
  if((S.hl.stars.length||(S.hl.dso&&S.hl.dso.length))&&S.hl.pulse)anim=true;
  if(anim||needs){needs=false;render(now);if(!anim||now-lastHud>150){updateHud();lastHud=now}}
  requestAnimationFrame(tick);
}

// ---------------------------------------------------------------- tween
const tween={active:false};
function flyTo(o,dur){
  dur=dur==null?1100:dur;
  const from={az:S.az,alt:S.alt,fov:S.fov};
  let toAz=o.az!=null?o.az:S.az; let d=((toAz-from.az+540)%360)-180;
  tween.active=true;tween.t0=performance.now();tween.dur=Math.max(1,dur);tween.from=from;
  tween.to={az:from.az+d,alt:o.alt!=null?clamp(o.alt,-89,90):S.alt,fov:o.fov!=null?clamp(o.fov,1,160):S.fov};
  tween.done=o.done||null;
  if(dur<=1){S.az=((tween.to.az%360)+360)%360;S.alt=tween.to.alt;S.fov=tween.to.fov;tween.active=false;dirty();if(tween.done)tween.done()}
}
function tweenStep(now){
  let p=(now-tween.t0)/tween.dur; if(p>=1)p=1;
  const e=p<0.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
  const fovE=Math.exp(lerp(Math.log(tween.from.fov),Math.log(tween.to.fov),e));
  S.az=(((lerp(tween.from.az,tween.to.az,e))%360)+360)%360;S.alt=lerp(tween.from.alt,tween.to.alt,e);S.fov=fovE;
  if(p>=1){tween.active=false;if(tween.done)tween.done()}
}
// look-at helpers
function lookAtH(h,fov,dur,done){const a=vecAzAlt(h);flyTo({az:a.az,alt:a.alt,fov:fov,done},dur)}

// ---------------------------------------------------------------- objects: pick/select
function selPos(){
  const o=S.sel; if(!o)return null;
  let h=objH(o); if(!h||!proj(...h))return null; return {x:P.x,y:P.y};
}
function objH(o){
  if(o.type==='star'){const i=o.i;return [sE[i],sN[i],sU[i]]}
  if(o.type==='body'){return o.b.h}
  if(o.type==='dso'){return j2000H(o.d.x,o.d.y,o.d.z)}
  if(o.type==='con'){const c=CON[o.k];return j2000H(c.x,c.y,c.z)}
  return null;
}
function pickAt(px,py){
  let best=null,bd=1e9;
  const cons=(o,d)=>{if(d<bd){bd=d;best=o}};
  // bodies first
  const bl=[FR.sun,FR.moon,...FR.planets];
  for(const b of bl){ if(!b._s)continue; if(S.show.ground&&b.alt<-1.5)continue; const R=b.id==='Moon'?(b._R||8):b.id==='Sun'?9:6; const d=Math.hypot(b._s.x-px,b._s.y-py); if(d<Math.max(R+6,14)) cons({type:'body',b},d-8); }
  const lim=limMagNow();
  for(let i=0;i<N;i++){
    if(!sVis[i])continue; if(STARS[i][2]>lim+0.3)continue; if(S.show.ground&&sU[i]<0)continue;
    const d=Math.hypot(sPX[i]-px,sPY[i]-py); if(d<16){const score=d+STARS[i][2]*1.2; cons({type:'star',i},score)}
  }
  if(S.show.dso)for(const d0 of DSOS){ if(!d0._vis)continue; const d=Math.hypot(d0._px-px,d0._py-py); if(d<18)cons({type:'dso',d:d0},d+3) }
  return bd<999?best:null;
}
function select(o,fly){
  S.sel=o; showInfo(o); dirty();
  if(fly&&o){const h=objH(o); if(h){ lookAtH(h,Math.min(S.fov,o.type==='body'&&o.b.id==='Moon'?20:60),900)}}
}
function pickCon(px,py){ // nearest constellation by figure star proximity
  let best=null,bd=1e9;
  for(const k of conKeys){ const mem=MEM[k]||[]; for(const i of mem){ if(!sVis[i])continue; const d=Math.hypot(sPX[i]-px,sPY[i]-py); if(d<bd){bd=d;best=k} } }
  return bd<90?best:null;
}

  }
});

// =============================================================== 자료 → 문장 채우기
const NAMEFIX={Cih:'Cih'};
function showPlace(sc){return (!sc.place||sc.place==='seosan')?(PL.userPlace||PL.placeById('seosan')):PL.placeById(sc.place)}
function starIdx(name){const i=PL.idxByName(name);if(i==null)console.warn('no star',name);return i}
function starVec3(i){const s=STARS[i],r=s[0]*D2R,d=s[1]*D2R,L=s[4]*3.26156;return [L*Math.cos(d)*Math.cos(r),L*Math.cos(d)*Math.sin(r),L*Math.sin(d)]}
function roundYrs(ly){return ly<100?String(Math.round(ly)):(Math.round(ly/10)*10).toLocaleString('ko-KR')}
const DIRW=['북','북동','동','남동','남','남서','서','북서'];
function dirWord(az){return DIRW[Math.round((((az%360)+360)%360)/45)%8]}
function sceneTime(sc){
  const pl=showPlace(sc); const tz=pl.tz;
  if(sc.time==='tonight'){const p=PL.localParts(Date.now(),tz);return Date.UTC(p.y,p.m-1,p.d,21-tz,0)}
  if(sc.time==='firstQuarter'){
    try{let mq=Astronomy.SearchMoonQuarter(new Date());let g=0;while(mq.quarter!==1&&g++<6)mq=Astronomy.NextMoonQuarter(mq);const p=PL.localParts(mq.time.date.getTime(),tz);return Date.UTC(p.y,p.m-1,p.d,21-tz,0)}catch(e){return Date.now()}
  }
  return PL.fromLocalInput(sc.time,tz);
}
function planetsAt(t,pl){
  const date=new Date(t),obs=new Astronomy.Observer(pl.lat,pl.lon,0);
  const hz=(id)=>{const eq=Astronomy.Equator(id,date,obs,true,true);return Astronomy.Horizon(date,obs,eq.ra,eq.dec,'normal')};
  const sun=hz('Sun'); const out=[];
  if(sun.altitude>-6)return {sunAlt:sun.altitude,list:[]};
  for(const p of PLANETS){ if(['Uranus','Neptune'].includes(p.id))continue; const h=hz(p.id); let mag=3; try{mag=Astronomy.Illumination(p.id,date).mag}catch(e){}
    if(h.altitude>8&&mag<2.5)out.push({ko:p.ko,mag,az:h.azimuth,alt:h.altitude}) }
  out.sort((a,b)=>a.mag-b.mag); return {sunAlt:sun.altitude,list:out};
}
function resolve(str,sc){
  if(!str)return '';
  const pl=showPlace(sc); const t=sceneTime(sc);
  return str.replace(/\{([a-z]+)(?::([^}]*))?\}/g,(m,key,arg)=>{
    try{
      if(key==='ly'||key==='yrs'||key==='type'||key==='mag'){
        const i=starIdx(arg); if(i==null)return '?';
        const ly=PL.starDistLy(i);
        if(key==='ly')return PL.fmtLy(ly);
        if(key==='yrs')return roundYrs(ly);
        if(key==='mag')return STARS[i][2].toFixed(1);
        const sp=PL.specInfo(STARS[i][6]); return sp?`${sp[1].replace('(태양과 같은 종류)','')}(표면 ${sp[2]})`:'';
      }
      if(key==='place')return pl.name;
      if(key==='latint')return String(Math.round(pl.lat));
      if(key==='sep'){const [a,b]=arg.split(',');const ia=starIdx(a),ib=starIdx(b);const A=starVec3(ia),B=starVec3(ib);return PL.fmtLy(Math.hypot(A[0]-B[0],A[1]-B[1],A[2]-B[2]))}
      if(key==='moonage'){const ph=Astronomy.MoonPhase(new Date(t));return (ph/360*29.530588).toFixed(1)}
      if(key==='planets'){
        const r=planetsAt(t,pl);
        if(!r.list.length)return '오늘 밤 아홉 시에는 맨눈으로 쉽게 볼 수 있는 밝은 행성이 하늘에 거의 보이지 않습니다.';
        return '오늘 밤 아홉 시에는 '+r.list.map(p=>`${dirWord(p.az)}쪽 하늘에 ${p.ko}(${p.mag.toFixed(1)}등급)`).join(', ')+'이 보입니다.';
      }
    }catch(e){console.warn('resolve',m,e)}
    return m;
  });
}
function resolveLight(sc){
  const rows=[['달','약 1.3초'],['태양','약 8분 20초'],['시리우스','약 '+roundYrs(PL.starDistLy(starIdx('Sirius')))+'년'],['베가(직녀성)','약 '+roundYrs(PL.starDistLy(starIdx('Vega')))+'년'],['알타이르(견우성)','약 '+roundYrs(PL.starDistLy(starIdx('Altair')))+'년'],['북극성','약 '+roundYrs(PL.starDistLy(starIdx('Polaris')))+'년'],['베텔게우스','약 '+roundYrs(PL.starDistLy(starIdx('Betelgeuse')))+'년'],['안드로메다은하','약 250만 년']];
  return '<h3>오늘 우리가 보는 빛이 출발한 때</h3><table>'+rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]} 전</td></tr>`).join('')+'</table><div class="note">※ 먼 별의 거리는 측정 방법에 따라 값이 달라질 수 있어요.</div>';
}

const SH={on:false,i:-1,paused:false,token:0,sub:true,voice:true,speed:1,clock:0,steps:[],phase:'',wait:0,fallbackLeft:0,onEnd:null,autoNext:true,saved:null,koVoice:null,voicesTried:false};

  const pick=()=>{const vs=speechSynthesis.getVoices();SH.koVoice=vs.find(v=>/^ko/i.test(v.lang)&&/natural|neural|google|sunhi|heami|yuna|seoyeon|sun-hi/i.test(v.name))||vs.find(v=>/^ko/i.test(v.lang))||null};

function buildDrawer(){
  const d=$('#drawer');
  d.innerHTML=`<h2>🎙 별자리 해설</h2><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px"><button class="btn sm" id="dStart">▶ 처음부터 시작</button><button class="btn sm" id="dScript">📄 교사용 대본</button><button class="btn sm" id="dClose">닫기</button></div><div style="color:var(--dim);font-size:12.5px;margin-bottom:8px">장면을 눌러 원하는 곳부터 시작할 수 있어요. 해설은 소리와 자막으로 진행되고, 끝에 학생에게 던지는 질문이 나옵니다.</div>`+SHOW.map((s,i)=>`<div class="sc" data-i="${i}">${esc(s.title)}<small>${esc(s.time==='tonight'?'오늘 밤 9시':s.time==='firstQuarter'?'가까운 상현달 날':s.time.replace('T',' '))}</small></div>`).join('');
  d.querySelectorAll('.sc').forEach(el=>el.onclick=()=>{startShow(+el.dataset.i);d.style.display='none'});
  $('#dStart').onclick=()=>{startShow(0);d.style.display='none'};
  $('#dClose').onclick=()=>{d.style.display='none'};
  $('#dScript').onclick=()=>{openScript()};
}
window.toggleShowDrawer=()=>{const d=$('#drawer');if(!d.innerHTML)buildDrawer();d.style.display=d.style.display==='block'?'none':'block';markDrawer()};
function markDrawer(){document.querySelectorAll('#drawer .sc').forEach((el,i)=>el.classList.toggle('cur',SH.on&&i===SH.i))}

function buildShowBar(){
  const b=$('#showbar');
  b.innerHTML=`<button class="btn sm" id="shPrev">⏮</button><button class="btn sm" id="shPlay">⏸</button><button class="btn sm" id="shNext">⏭</button><div class="prog"><div id="shProg"></div></div><span class="sn" id="shSn"></span><button class="btn sm on" id="shSub">자막</button><button class="btn sm on" id="shVoice">🔊</button><button class="btn sm" id="shSpd">×1.0</button><button class="btn sm" id="shList">목록</button><button class="btn sm" id="shStop">✕</button>`;
  $('#shPrev').onclick=()=>gotoScene(SH.i-1);$('#shNext').onclick=()=>gotoScene(SH.i+1);
  $('#shPlay').onclick=()=>setPaused(!SH.paused);
  $('#shSub').onclick=e=>{SH.sub=!SH.sub;e.target.classList.toggle('on',SH.sub);$('#subtitle').style.display=SH.sub&&SH.on?'block':'none'};
  $('#shVoice').onclick=e=>{SH.voice=!SH.voice;e.target.classList.toggle('on',SH.voice);e.target.textContent=SH.voice?'🔊':'🔇';if(!SH.voice&&'speechSynthesis' in window)speechSynthesis.cancel();restartNarration()};
  $('#shSpd').onclick=e=>{const L=[0.8,1,1.2,1.4];SH.speed=L[(L.indexOf(SH.speed)+1)%L.length];e.target.textContent='×'+SH.speed.toFixed(1);restartNarration()};
  $('#shList').onclick=()=>window.toggleShowDrawer();
  $('#shStop').onclick=stopShow;
}
function startShow(i){
  if(!$('#showbar').innerHTML)buildShowBar();
  if(!SH.on){ SH.saved={lp:S.lp,show:Object.assign({},S.show),t:S.t,rate:S.rate,playing:S.playing,az:S.az,alt:S.alt,fov:S.fov,place:S.place,lat:S.lat,lon:S.lon,tz:S.tz,rateIdx:null}; }
  S.cyFrac=0.36; SH.on=true; document.getElementById('toast').style.display='none'; $('#showbar').style.display='flex'; $('#timebar').style.display='none'; $('#info').style.display='none'; S.sel=null; S.measure.on=false; S.measure.pts=[];
  PL.refreshToolbar(); gotoScene(i||0,true);
}
function stopShow(){
  S.cyFrac=0.5; SH.on=false;SH.token++; if('speechSynthesis' in window)speechSynthesis.cancel();
  $('#showbar').style.display='none';$('#timebar').style.display='flex';$('#subtitle').style.display='none';hidePanel();close3D();
  S.hl={cons:[],stars:[],ast:[],guides:[],dso:[],labels:true,pulse:true};
  if(SH.saved){S.lp=SH.saved.lp;S.show=SH.saved.show;S.rate=SH.saved.rate;S.playing=SH.saved.playing;S.show.trails=false}
  PL.refreshToolbar();PL.dirty();markDrawer();
}
function setPaused(p){
  SH.paused=p; $('#shPlay').textContent=p?'▶':'⏸';
  if('speechSynthesis' in window&&SH.usingTTS){ if(p)speechSynthesis.pause(); else speechSynthesis.resume() }
  if(S.rate!==0&&SH.saved){S.playing=!p}
  PL.dirty();
}
function gotoScene(i,first){
  if(i<0)i=0; if(i>=SHOW.length){stopShow();PL.toast('해설이 끝났습니다');return}
  SH.token++; if('speechSynthesis' in window)speechSynthesis.cancel(); SH.usingTTS=false;
  SH.i=i; SH.paused=false; $('#shPlay').textContent='⏸'; markDrawer();
  const sc=SHOW[i];
  const pl=showPlace(sc); const t=sceneTime(sc);
  const needFade=!first&&(Math.abs(t-S.t)>1000||S.place!==pl||S.lp!==sc.lp);

function conAt(l){l=norm(l);for(const c of CB){const a=c[1],b=c[2];if(a<b?(l>=a&&l<b):(l>=a||l<b))return c}return CB[0]}
const conKo=k=>k==='Oph'?'뱀주인자리':CON[k].ko;
function midLon(c){let a=c[1],b=c[2];if(b<a)b+=360;return norm((a+b)/2)}
function widthDeg(c){let a=c[1],b=c[2];if(b<a)b+=360;return b-a}
function eclVec(lam,beta){const L=lam*D2R,B=(beta||0)*D2R;const x=Math.cos(L)*Math.cos(B),y0=Math.sin(L)*Math.cos(B),z0=Math.sin(B);return [x,y0*Math.cos(EPS)-z0*Math.sin(EPS),y0*Math.sin(EPS)+z0*Math.cos(EPS)]}
const hv=(lam,beta)=>{const v=eclVec(lam,beta);return PL.j2000H(v[0],v[1],v[2])};
const pad=n=>String(n).padStart(2,'0');
function localHour(t){const d=new Date(t+S.tz*3600e3);return d.getUTCHours()+d.getUTCMinutes()/60+d.getUTCSeconds()/3600}
function localMidnight(t){const p=PL.localParts(t,S.tz);return Date.UTC(p.y,p.m-1,p.d,-S.tz,0)}
function fmtDate(t){const p=PL.localParts(t,S.tz);return p.m+'월 '+p.d+'일'}
function fmtHour(h){const hh=Math.floor(h),mm=Math.round((h-hh)*60);const H=hh%24;return (H<12?'오전 ':'오후 ')+(H%12===0?12:H%12)+'시'+(mm?(' '+mm+'분'):'')}
const yearNow=()=>PL.localParts(Date.now(),S.tz).y;
function dayT(year,day,hour){return Date.UTC(year,0,1+day,hour-S.tz,0)}
function dayOfYear(t){const p=PL.localParts(t,S.tz);return Math.round((Date.UTC(p.y,p.m-1,p.d)-Date.UTC(p.y,0,1))/86400e3)}
// 해가 머무는 기간(실제 별자리) 계산
function sunSpans(year){
  const out=[];let cur=null;
  for(let d=0;d<=366;d++){const t=dayT(year,d,12);const c=conAt(sunLon2000(t)); if(!cur||cur.k!==c[0]){cur={k:c[0],start:t,end:t};out.push(cur)}else cur.end=t}
  return out;
}

function sizeCanvas(){

// ================================================================== 열기/닫기
function open(){
  if(window.SHOW_API&&window.SHOW_API.SH.on)window.SHOW_API.stopShow();
  if(window.TONIGHT_API)window.TONIGHT_API.close();if(window.NOW_API)window.NOW_API.close();

  Z.open=true; Z.year=yearNow(); el.style.display='block';
  $('#info').style.display='none'; S.sel=null; $('#hudTL').style.display='none';
  const W=window.innerWidth; if(W>=900){const wp=Math.min(440,W*0.94);S.cxFrac=(wp+(W-wp)/2)/W;S.cyFrac=0.5}else{S.cxFrac=0.5;S.cyFrac=0.22}
  S.playing=false;S.rate=0;PL.setRateIdx(4);
  setTab(Z.tab||2,true); PL.refreshToolbar();
}
function close(){
  if(!Z.open)return; Z.open=false; Z.playing=false; Z.follow=false; Z.banner='';

  S.cxFrac=0.5;S.cyFrac=0.5;S.hideConLabels=null;

}
window.toggleZodiac=()=>Z.open?close():open();
window.__zodiacOn=()=>Z.open;

// ================================================================== 탭
function setTab(n,first){
  Z.tab=n; Z.playing=false; Z.banner=''; Z.follow=false; S.hl={cons:[],stars:[],ast:[],guides:[],dso:[],labels:true,pulse:true};
  el.querySelectorAll('[data-z]').forEach(b=>b.classList.toggle('on',+b.dataset.z===n));
  S.hideConLabels=(n===1)?null:new Set(CB.map(c=>c[0])); S.show.trails=false; S.show.lines=true; S.show.names=true; S.show.ground=true; S.show.atmo=true; S.show.bodies=true; S.show.agrid=false; S.show.egrid=false;
  PL.refreshToolbar();
  if(n===1){
    const y=PL.localParts(S.t,S.tz); if(sunLonDate(S.t)||true){ S.t=Date.UTC(y.y,y.m-1,y.d,10-S.tz,0) }
    PL.flyTo({az:180,alt:34,fov:125},first?10:900);
  } else if(n===2){
    Z.mode='noon'; const t0=S.t; Z.dayf=dayOfYear(t0); S.t=dayT(PL.localParts(t0,S.tz).y,Z.dayf,12); applyMode();
  } else if(n===3){
    if(!Z.birth){const p=PL.localParts(Date.now(),S.tz);Z.birth={m:p.m,d:p.d}}
    applyBirth('noon');
  } else if(n===4){
    S.show.atmo=false;S.show.ground=false; applyYear(first?2026:Z.yv,true);
  }
  buildCtl(); updateRead(true); PL.dirty();
}
function applyMode(){
  if(Z.mode==='noon'){
    S.show.atmo=false;S.show.ground=false; Z.follow=true;
    S.t=dayT(PL.localParts(S.t,S.tz).y,Z.dayf,12);
    PL.frameSetup(); const a=PL.vecAzAlt(FR.sun.h); PL.flyTo({az:a.az,alt:a.alt,fov:75},700);
  } else {
    S.show.atmo=true;S.show.ground=true; Z.follow=false;
    S.t=dayT(PL.localParts(S.t,S.tz).y,Z.dayf+1,0);   // 그날 밤 자정
    PL.flyTo({az:180,alt:42,fov:112},700);
  }
  PL.dirty();
}
function applyYear(yv,fly){
  Z.yv=yv; const p=pLon((yv-2000)/100); const lamEq=norm(-p);
  if(fly){const v=eclVec(lamEq,0);PL.frameSetup();const h=PL.j2000H(v[0],v[1],v[2]);const a=PL.vecAzAlt(h);PL.flyTo({az:a.az,alt:a.alt,fov:105},900)}
  PL.dirty();
}
function modelDrag(e){
  const r=cvm.getBoundingClientRect(); const x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;
  if(Z.tab===1){
    const ang=Math.atan2(-y,x)*R2D; // 관측자 각도
    let h=12+ang/15; h=((h%24)+24)%24; const mid=localMidnight(S.t); S.t=mid+h*3600e3; PL.dirty();
  } else if(Z.tab===2||Z.tab===3){
    const Le=norm(Math.atan2(-y,x)*R2D); const lamS=norm(Le-180);
    // 현재 태양 경도와의 차이만큼 날짜 이동
    let cur=sunLon2000(S.t); let diff=((lamS-cur+540)%360)-180; S.t+=diff/0.9856*86400e3;
    for(let k=0;k<2;k++){cur=sunLon2000(S.t);diff=((lamS-cur+540)%360)-180;S.t+=diff/0.9856*86400e3}
    const p=PL.localParts(S.t,S.tz); Z.dayf=dayOfYear(S.t);
    const hr=Z.tab===2&&Z.mode==='noon'?12:(Z.tab===2?24:12); S.t=dayT(p.y,Z.dayf,hr===24?0:12); if(Z.tab===2&&Z.mode==='mid')S.t=dayT(p.y,Z.dayf+1,0);
    if(Z.tab===3)Z.birth={m:p.m,d:p.d};
    const sl=$('#zDay'); if(sl)sl.value=Z.dayf; PL.dirty();
  }
}

  } else {

function bindCtl(){
  const g=id=>document.getElementById(id);
  if(Z.tab===1){
    g('zHour').oninput=e=>{S.t=localMidnight(S.t)+(+e.target.value)*3600e3;PL.dirty()};
    g('zPlay').onclick=()=>{Z.playing=!Z.playing;g('zPlay').textContent=Z.playing?'⏸ 멈춤':'▶ 하루 재생'};
    g('zDate').onchange=e=>{const m=/^(\d+)-(\d+)-(\d+)$/.exec(e.target.value);if(m){const h=localHour(S.t);S.t=Date.UTC(+m[1],+m[2]-1,+m[3],h-S.tz,0);PL.dirty()}};
    g('zToday').onclick=()=>{const p=PL.localParts(Date.now(),S.tz);S.t=Date.UTC(p.y,p.m-1,p.d,localHour(S.t)-S.tz,0);PL.dirty()};
    g('zTrail').onclick=()=>{S.show.trails=!S.show.trails;S.trailHours=4;g('zTrail').classList.toggle('on',S.show.trails);PL.dirty()};
  } else if(Z.tab===2){
    g('zDay').oninput=e=>{Z.dayf=+e.target.value;Z.playing=false;g('zPlay').textContent='▶ 1년 재생';const y=PL.localParts(S.t,S.tz).y;S.t=Z.mode==='noon'?dayT(y,Z.dayf,12):dayT(y,Z.dayf+1,0);PL.dirty()};
    g('zPlay').onclick=()=>{Z.playing=!Z.playing;g('zPlay').textContent=Z.playing?'⏸ 멈춤':'▶ 1년 재생'};
    g('zSpd').onchange=e=>{Z.dayRate=+e.target.value};g('zSpd').value=String(Z.dayRate);
    g('zNoon').onclick=()=>{Z.mode='noon';applyMode();buildCtl();updateRead(true)};
    g('zMid').onclick=()=>{Z.mode='mid';applyMode();buildCtl();updateRead(true)};
    g('zOv').onclick=()=>{Z.overlay=!Z.overlay;g('zOv').classList.toggle('on',Z.overlay);PL.dirty()};
  } else if(Z.tab===3){
    const upd=()=>{Z.birth={m:+g('zBm').value,d:+g('zBd').value};if(Z.bmode)applyBirth(Z.bmode);else{S.t=birthT(12);PL.dirty()}updateRead(true)};
    g('zBm').onchange=upd;g('zBd').onchange=upd;
    g('zB1').onclick=()=>applyBirth('noon');g('zB4').onclick=()=>applyBirth('dusk');g('zB2').onclick=()=>applyBirth('night');g('zB3').onclick=()=>applyBirth('best');
  } else {
    g('zYear').oninput=e=>{Z.yv=+e.target.value;Z.playing=false;g('zPlay').textContent='▶ 시간 여행';applyYear(Z.yv,false)};
    g('zPlay').onclick=()=>{Z.playing=!Z.playing;g('zPlay').textContent=Z.playing?'⏸ 멈춤':'▶ 시간 여행'};
    g('zY1').onclick=()=>{Z.playing=false;applyYear(-100,true)};g('zY2').onclick=()=>{Z.playing=false;applyYear(2026,true)};g('zY3').onclick=()=>{Z.playing=false;applyYear(2600,true)};
  }
}
function birthT(hour){const y=Z.year;return Date.UTC(y,Z.birth.m-1,Z.birth.d,hour-S.tz,0)}
function signCenterVec(k){const c=CB.find(x=>x[0]===k);return eclVec(midLon(c),0)}
function altOf(t,v){const m=PL.matrixAt(t,S.lat,S.lon).M;const u=m[6]*v[0]+m[7]*v[1]+m[8]*v[2];const e=m[0]*v[0]+m[1]*v[1]+m[2]*v[2],n=m[3]*v[0]+m[4]*v[1]+m[5]*v[2];let az=Math.atan2(e,n)*R2D;if(az<0)az+=360;return {alt:Math.asin(clamp(u,-1,1))*R2D,az}}
function sunsetT(){const o=new Astronomy.Observer(S.lat,S.lon,0);try{const r=Astronomy.SearchRiseSet('Sun',o,-1,new Date(birthT(0)),1);if(r)return r.date.getTime()}catch(e){}return birthT(18)}
function bestDayFor(k){const v=signCenterVec(k);let best=0,ba=-99;const y=Z.year;for(let d=0;d<365;d++){const t=dayT(y,d,21);const r=altOf(t,v);if(r.alt>ba){ba=r.alt;best=d}}return {day:best,alt:ba,t:dayT(y,best,21)}}
const DIRW=['북','북동','동','남동','남','남서','서','북서'];const dirWord=az=>DIRW[Math.round(norm(az)/45)%8];
function applyBirth(mode){
  Z.bmode=mode; Z.follow=false;
  const key=signAtBirth();
  if(mode==='noon'){
    S.show.atmo=false;S.show.ground=false; S.t=birthT(12); PL.frameSetup();
    S.hl={cons:[key.signKey,key.actualKey].filter((v,i,a)=>a.indexOf(v)===i),stars:[],ast:[],guides:[],dso:[],labels:true,pulse:true};
    Z.banner='☀ 생일 낮 12시: 태양은 실제로 '+conKo(key.actualKey)+' 안에 있어요';
    const a=PL.vecAzAlt(FR.sun.h); PL.flyTo({az:a.az,alt:a.alt,fov:75},800);
  } else if(mode==='night'){
    S.show.atmo=true;S.show.ground=true; S.t=birthT(24);
    S.hl={cons:[key.signKey],stars:[],ast:[],guides:[],dso:[],labels:true,pulse:true};
    const al=altOf(S.t,signCenterVec(key.signKey)).alt;
    Z.banner='🌙 한밤(자정): 내 별자리('+key.signKo+')는 '+(al<0?'지평선 아래라 보이지 않아요':'낮게 걸려 있어요')+' (고도 '+Math.round(al)+'°) · 남쪽 하늘에는 '+conKo(key.oppKey)+'가 보여요';
    PL.flyTo({az:180,alt:42,fov:112},800);
  } else if(mode==='dusk'){
    S.show.atmo=true;S.show.ground=true; S.t=sunsetT()+60*60e3;
    S.hl={cons:[key.signKey],stars:[],ast:[],guides:[],dso:[],labels:true,pulse:true};
    const r=altOf(S.t,signCenterVec(key.signKey));
    Z.banner='🌆 해 진 1시간 뒤: 내 별자리('+key.signKo+')는 '+(r.alt>4?dirWord(r.az)+'쪽 하늘 낮은 곳(고도 '+Math.round(r.alt)+'°)에 잠깐 보여요':'이미 지평선 아래로 졌어요');
    PL.frameSetup();PL.flyTo({az:r.alt>4?r.az:270,alt:Math.max(8,Math.min(r.alt,40)),fov:100},900);
  } else {
    // 내 별자리가 밤 9시에 가장 높이 뜨는 날 찾기
    const c=CB.find(x=>x[0]===key.signKey); const v=eclVec(midLon(c),0);
    let best=0,ba=-99; const y=Z.year;
    for(let d=0;d<365;d++){const t=dayT(y,d,21);const m=PL.matrixAt(t,S.lat,S.lon).M;const u=m[6]*v[0]+m[7]*v[1]+m[8]*v[2];const alt=Math.asin(clamp(u,-1,1))*R2D;if(alt>ba){ba=alt;best=d}}
    S.show.atmo=true;S.show.ground=true; S.t=dayT(y,best,21); Z.bestDay=best; Z.bestAlt=ba;
    S.hl={cons:[key.signKey],stars:[],ast:[],guides:[],dso:[],labels:true,pulse:true};
    Z.banner='✨ '+fmtDate(S.t)+' 밤 9시: '+conKo(key.signKey)+'가 남쪽 하늘 높이 떠요 (고도 '+Math.round(ba)+'°)';

function poiClass(t){
  if(t.place&&/^(city|town|village|suburb|neighbourhood|hamlet|quarter|isolated_dwelling)$/.test(t.place))return {c:'place',pr:0,ico:'📍'};
  const am=t.amenity||'';
  if(am==='school'||am==='kindergarten'||am==='university'||am==='college')return {c:'school',pr:1,ico:'🏫'};
  if(/^(townhall|police|fire_station|hospital|clinic|library|community_centre|post_office|courthouse)$/.test(am)||t.office==='government')return {c:'public',pr:1,ico:'🏛'};
  if(t.building==='apartments'||t.building==='residential'||t.landuse==='residential')return {c:'apt',pr:2,ico:'🏢'};
  if(t.railway==='station'||t.public_transport==='station')return {c:'public',pr:1,ico:'🚉'};
  if(t.leisure||t.tourism||t.historic)return {c:'leisure',pr:2,ico:'🌳'};
  if(t.shop||am==='restaurant'||am==='cafe'||am==='bank'||am==='fuel')return {c:'shop',pr:3,ico:'🏪'};
  if(t.industrial||t.building==='industrial'||t.man_made==='works')return {c:'ind',pr:3,ico:'🏭'};

   'nwr["name"]["amenity"~"school|kindergarten|university|college|townhall|police|fire_station|hospital|library|community_centre|post_office|courthouse"]'+a+';'+
   'nwr["name"]["building"~"apartments|residential|public|civic|church|hospital|school|industrial|commercial|retail"]'+a+';'+
   'nwr["name"]["leisure"~"park|stadium|sports_centre|pitch"]'+a+';'+

    const la=e.lat!=null?e.lat:(e.center&&e.center.lat), lo=e.lon!=null?e.lon:(e.center&&e.center.lon); if(la==null||lo==null)continue;
    const cl=poiClass(t); const east=(lo-lon)*kx, north=(la-lat)*ky, dist=Math.hypot(east,north);
    if(dist<25)continue; if(cl.c!=='place'&&dist>2200)continue;
